# CC CompilationCheck: compile with various mingw-gcc versions and run tests with Wine

#name: 'Weekly CI CC - Alpine Linux MinGW'
name: 'alpine-mingw'
on:
  workflow_dispatch:
defaults: { run: { shell: bash } }
env:
  CMAKE_REQUIRED_QUIET: 'OFF'
  CMAKE_VERBOSE_MAKEFILE: 'ON'
  CTEST_OUTPUT_ON_FAILURE: 'ON'
  DEBIAN_FRONTEND: noninteractive
  UPX_CMAKE_CONFIG_FLAGS: -Wdev --warn-uninitialized
  UPX_DEBUG_TEST_FLOAT_DIVISION_BY_ZERO: 1
  UPX_DEBUG_TEST_LIBC_QSORT: 1
  ZSTD_CLEVEL: 17

jobs:
  job-alpine-mingw: # uses cmake + make
    #if: github.repository_owner == 'upx'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { container: 'alpine:3.11', wine: true,  i686_mingw: false } # wine-4.0.3 gcc-9.2
          - { container: 'alpine:3.12', wine: true,  i686_mingw: false } # wine-4.0.3 gcc-9.3
          - { container: 'alpine:3.13', wine: true,  i686_mingw: false } # wine-4.0.3 gcc-10.2
          - { container: 'alpine:3.14', wine: true,  i686_mingw: false } # wine-6.18  gcc-10.3
          - { container: 'alpine:3.15', wine: true,  i686_mingw: false } # wine-6.23  gcc-11.2
          - { container: 'alpine:3.16', wine: true,  i686_mingw: false } # wine-7.8   gcc-11.3
          - { container: 'alpine:3.17', wine: true,  i686_mingw: false } # wine-7.21  gcc-12.2
          # Wine >= 8.0 can run i686 32-bit programs in WOW64 mode on pure 64-bit systems
          - { container: 'alpine:3.18', wine: true,  i686_mingw: true }  # wine-8.13  gcc-12.2
          - { container: 'alpine:3.19', wine: true,  i686_mingw: true }  # wine-8.21  gcc-13.2
          - { container: 'alpine:3.20', wine: true,  i686_mingw: true }  # wine-9.0   gcc-13.2
          - { container: 'alpine:3.21', wine: true,  i686_mingw: true }  # wine-9.17  gcc-14.2
          - { container: 'alpine:3.22', wine: true,  i686_mingw: true }  # wine-10.7  gcc-14.2
          - { container: 'alpine:3.23', wine: true,  i686_mingw: true }  # wine-10.19 gcc-15.2
          - { container: 'alpine:3.24', wine: true,  i686_mingw: true }  # wine-11.0  gcc-15.2
          - { container: 'alpine:edge', wine: true,  i686_mingw: true }  # wine-xx.x  gcc-x.x
    name: ${{ format('container {0}', matrix.container) }}
    runs-on: ubuntu-24.04
    container: ${{ matrix.container }}
    steps:
      - name: ${{ format('Install packages {0}', matrix.container) }}
        shell: sh
        run: |
          apk update && apk upgrade && apk add bash cmake coreutils file git make parallel strace tar util-linux xz zstd
          apk add mingw-w64-gcc
          test "${{ matrix.i686_mingw }}" = "true" && apk add i686-mingw-w64-gcc
          true
      - run: set -x; cat /etc/alpine-release || true
      - run: (apk info -v | LC_ALL=C sort) || true
      - name: 'Install Wine'
        if: ${{ matrix.wine }}
        run: |
          apk add wine
          test -f /usr/bin/wine || ln -s -v wine64 /usr/bin/wine # needed for Alpine < 3.18
          ls -ldF /usr/bin/wine* || true
          mkdir -p -v ~/.wine
          wineboot --init
      - run: (apk info -v | LC_ALL=C sort) || true
      - name: ${{ format('Check out UPX {0} source code', github.ref_name) }}
        run: |
          git config --global --add safe.directory '*' # needed when running in a container
          git clone --branch "$GITHUB_REF_NAME" --depth 1 "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" .
          git submodule update --init
      - name: 'Build cmake extra/cross-windows-mingw32/debug'
        if: ${{ matrix.i686_mingw }}
        run:   'make build/extra/cross-windows-mingw32/debug'
      - name: 'Build cmake extra/cross-windows-mingw32/release'
        if: ${{ matrix.i686_mingw }}
        run:   'make build/extra/cross-windows-mingw32/release'
      - name: 'Build cmake extra/cross-windows-mingw64/debug'
        run: |
          # on Alpine 3.11 and 3.12 CMake does not find AR; Alpine >= 3.13 (with CMake 3.18.4) works
          X=
          case "${{ matrix.container }}" in
            *:3.1[12]) X="CMAKE_AR=/usr/bin/x86_64-w64-mingw32-ar" ;;
          esac
          make build/extra/cross-windows-mingw64/debug $X
      - name: 'Build cmake extra/cross-windows-mingw64/release'
        run: |
          # on Alpine 3.11 and 3.12 CMake does not find AR; Alpine >= 3.13 (with CMake 3.18.4) works
          X=
          case "${{ matrix.container }}" in
            *:3.1[12]) X="CMAKE_AR=/usr/bin/x86_64-w64-mingw32-ar" ;;
          esac
          make build/extra/cross-windows-mingw64/release $X

      - name: Make artifact
        run: |
          N=$(echo "upx-${GITHUB_REF_NAME}-${GITHUB_SHA:0:7}-weekly-ci-alpine-mingw-${{ matrix.container }}" | sed 's/[^0-9a-zA-Z_.-]/-/g')
          mkdir -p "tmp/artifact/$N"
          for f in build/*/*/*/upx.exe; do
            d="${f%/*}" # dirname
            DESTDIR="$PWD/tmp/artifact/$N/InstallWithCMake/InstallWithDestdir/$d"         cmake --install $d
            DESTDIR="$PWD/tmp/artifact/$N/InstallWithCMake/InstallWithDestdir/$d"         cmake --install $d --prefix /temp/local/upx
            DESTDIR="$PWD/tmp/artifact/$N/InstallWithCMake/InstallWithDestdirAndStrip/$d" cmake --install $d --strip
            DESTDIR="$PWD/tmp/artifact/$N/InstallWithCMake/InstallWithDestdirAndStrip/$d" cmake --install $d --strip --prefix /temp/local/upx
            cmake --install $d --prefix "$PWD/tmp/artifact/$N/InstallWithCMake/InstallWithPrefix/$d"
            cmake --install $d --prefix "$PWD/tmp/artifact/$N/InstallWithCMake/InstallWithPrefixAndStrip/$d" --strip
          done
          (cd build && shopt -s nullglob && cp -v -ai --parents */upx{,.exe} */*/*/upx{,.exe} "../tmp/artifact/$N")
          (cd build && shopt -s globstar && cp -v -ai --parents **/dt_cxxlib.* "../tmp/artifact/$N")
          if command -v hardlink >/dev/null; then (cd "tmp/artifact/$N" && hardlink .) fi
          (cd tmp/artifact && tar --sort=name --zstd -cf "$N.tar.zst" "$N" && rm -rf "./$N" && ls -la && zstd -tq "$N.tar.zst")
          # currently need at least Alpine >= 3.16 for working nodejs on current GitHub Actions runner host
          case "${{ matrix.container }}" in
            i386/*) ;; # i386: missing nodejs on GitHub runner host
            *:3.[0-9] | *:3.1[0-5]) ;;
            *) echo "artifact_name=$N" >> $GITHUB_ENV ;;
          esac

      - name: ${{ format('Upload artifact {0}', env.artifact_name) }}
        if: ${{ env.artifact_name }}
        uses: actions/upload-artifact@v7
        with: { name: '${{ env.artifact_name }}', path: tmp/artifact }

      - name: ${{ format('Run test suite with Wine') }}
        if: ${{ matrix.wine }}
        run: |
          git clone --depth=1 https://github.com/upx/upx-testsuite ../upx-testsuite
          testsuite_1="$(readlink -fn ./misc/testsuite/upx_testsuite_1.sh)"
          export upx_exe_runner="wine"
          if test "${{ matrix.i686_mingw }}" = "true"; then
          UPX_TESTSUITE_LEVEL=2 \
          env -C build/extra/cross-windows-mingw32/debug   upx_exe=./upx.exe bash "$testsuite_1"
          UPX_TESTSUITE_LEVEL=4 \
          env -C build/extra/cross-windows-mingw32/release upx_exe=./upx.exe bash "$testsuite_1"
          fi
          UPX_TESTSUITE_LEVEL=2 \
          env -C build/extra/cross-windows-mingw64/debug   upx_exe=./upx.exe bash "$testsuite_1"
          UPX_TESTSUITE_LEVEL=4 \
          env -C build/extra/cross-windows-mingw64/release upx_exe=./upx.exe bash "$testsuite_1"

      - name: 'Run basic tests with Wine - mingw32/debug'
        if: ${{ matrix.wine && matrix.i686_mingw }}
        run: |
          set -ex -o pipefail
          cd build/extra/cross-windows-mingw32/debug
          [[ -f upx && ! -f upx.exe ]] && mv -i -v upx upx.exe
          pwd; file ./upx.exe
          wine=wine
          tt='./upx.exe'
          $wine ./upx.exe --version-short
          $wine ./upx.exe --sysinfo -vv
          $wine ./upx.exe -3 $tt -o tt.packed.exe
          $wine ./upx.exe -l tt.packed.exe
          $wine ./upx.exe -t tt.packed.exe
          $wine ./upx.exe -d tt.packed.exe -o tt.unpacked.exe
          $wine ./tt.packed.exe --version-short
          $wine ./tt.unpacked.exe --version-short

      - name: 'Run basic tests with Wine - mingw32/release'
        if: ${{ matrix.wine && matrix.i686_mingw }}
        run: |
          set -ex -o pipefail
          cd build/extra/cross-windows-mingw32/release
          [[ -f upx && ! -f upx.exe ]] && mv -i -v upx upx.exe
          pwd; file ./upx.exe
          wine=wine
          tt='./upx.exe'
          $wine ./upx.exe --version-short
          $wine ./upx.exe --sysinfo -vv
          $wine ./upx.exe -3 $tt -o tt.packed.exe
          $wine ./upx.exe -l tt.packed.exe
          $wine ./upx.exe -t tt.packed.exe
          $wine ./upx.exe -d tt.packed.exe -o tt.unpacked.exe
          $wine ./tt.packed.exe --version-short
          $wine ./tt.unpacked.exe --version-short

      - name: 'Run basic tests with Wine - mingw64/debug'
        if: ${{ matrix.wine }}
        run: |
          set -ex -o pipefail
          cd build/extra/cross-windows-mingw64/debug
          [[ -f upx && ! -f upx.exe ]] && mv -i -v upx upx.exe
          pwd; file ./upx.exe
          wine=wine
          tt='./upx.exe'
          $wine ./upx.exe --version-short
          $wine ./upx.exe --sysinfo -vv
          $wine ./upx.exe -3 $tt -o tt.packed.exe
          $wine ./upx.exe -l tt.packed.exe
          $wine ./upx.exe -t tt.packed.exe
          $wine ./upx.exe -d tt.packed.exe -o tt.unpacked.exe
          $wine ./tt.packed.exe --version-short
          $wine ./tt.unpacked.exe --version-short

      - name: 'Run basic tests with Wine - mingw64/release'
        if: ${{ matrix.wine }}
        run: |
          set -ex -o pipefail
          cd build/extra/cross-windows-mingw64/release
          [[ -f upx && ! -f upx.exe ]] && mv -i -v upx upx.exe
          pwd; file ./upx.exe
          wine=wine
          tt='./upx.exe'
          $wine ./upx.exe --version-short
          $wine ./upx.exe --sysinfo -vv
          $wine ./upx.exe -3 $tt -o tt.packed.exe
          $wine ./upx.exe -l tt.packed.exe
          $wine ./upx.exe -t tt.packed.exe
          $wine ./upx.exe -d tt.packed.exe -o tt.unpacked.exe
          $wine ./tt.packed.exe --version-short
          $wine ./tt.unpacked.exe --version-short

      - name: 'Run ctest tests with Wine - mingw32/debug'
        if: ${{ matrix.wine && matrix.i686_mingw }}
        run: 'make build/extra/cross-windows-mingw32/debug+test'

      - name: 'Run ctest tests with Wine - mingw32/release'
        if: ${{ matrix.wine && matrix.i686_mingw }}
        run: 'make build/extra/cross-windows-mingw32/release+test'

      - name: 'Run ctest tests with Wine - mingw64/debug'
        if: ${{ matrix.wine }}
        run: 'make build/extra/cross-windows-mingw64/debug+test'

      - name: 'Run ctest tests with Wine - mingw64/release'
        if: ${{ matrix.wine }}
        run: 'make build/extra/cross-windows-mingw64/release+test'

      - name: 'Mimic ctest tests with Wine - mingw32/debug'
        if: ${{ matrix.wine && matrix.i686_mingw }}
        run: 'env -C build/extra/cross-windows-mingw32/debug upx_exe=./upx.exe upx_exe_runner=wine bash "$PWD"/misc/testsuite/mimic_ctest.sh'

      - name: 'Mimic ctest tests with Wine - mingw32/release'
        if: ${{ matrix.wine && matrix.i686_mingw }}
        run: 'env -C build/extra/cross-windows-mingw32/release upx_exe=./upx.exe upx_exe_runner=wine bash "$PWD"/misc/testsuite/mimic_ctest.sh'

      - name: 'Mimic ctest tests with Wine - mingw64/debug'
        if: ${{ matrix.wine }}
        run: 'env -C build/extra/cross-windows-mingw64/debug upx_exe=./upx.exe upx_exe_runner=wine bash "$PWD"/misc/testsuite/mimic_ctest.sh'

      - name: 'Mimic ctest tests with Wine - mingw64/release'
        if: ${{ matrix.wine }}
        run: 'env -C build/extra/cross-windows-mingw64/release upx_exe=./upx.exe upx_exe_runner=wine bash "$PWD"/misc/testsuite/mimic_ctest.sh'

      - run: apk add binutils
      - run: ls -l build/*/*/*/upx.exe || true
      - run: size  build/*/*/*/upx.exe || true
      - run: file  build/*/*/*/upx.exe || true
